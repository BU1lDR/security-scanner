# Floors are the lowest version OSV reports nothing against, not the lowest
# version that happens to work. setuptools 61 is installable and carries four
# advisories, including CVE-2024-6345 (code execution through the package-index
# download path) and CVE-2025-47273 (path traversal). Nobody's build env here
# actually resolves that low — but "supported" is what this file says, and this
# project's own SCA scanner would flag a floor like that in someone else's
# manifest. Checked against api.osv.dev; see the note on dependencies below.
[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
# `security-scanner` is taken on PyPI — a different project by a different author,
# at 0.1.4 — so this name could never have been published, and anyone who typed
# `pip install security-scanner` would have got that package rather than this one.
# `secscan` was free and is what everything else here already says: the console
# script, the User-Agent the scanned party sees, the docs. Nothing reads the
# distribution name at runtime (no `importlib.metadata` call anywhere), so this is
# metadata-only; the module stays `scanner` and the command stays `secscan`.
name = "secscan"
# Read from scanner/__init__.py rather than written here. It was written here, and
# the two disagreed: this said 1.0.0 while the package said 0.1.0 and the default
# User-Agent said 0.1. A release number in three places is a release number that
# is wrong in two of them.
dynamic = ["version"]
description = "A unified SAST + DAST + SCA security scanner with an optional AI advisor."
readme = "README.md"
requires-python = ">=3.11"
# An SPDX string, not a TOML table. The table form is deprecated and setuptools
# says builds using it stop being supported on 2027-02-18 — a build that warns
# today and fails on a date is a build that is already broken, just not yet.
license = "MIT"
license-files = ["LICENSE"]
# Deliberately no `anthropic` SDK: the AI provider talks to the API over the
# shared httpx client so every request passes the one HTTP choke point and its
# egress allowlist (decisions.md D40, contract §9). An SDK with its own
# transport would bypass that gate, so it is not a dependency.
# Deliberately no `lxml` either: the crawler parses with stdlib "html.parser"
# (see scanners/dast/crawler.py), so the C-extension build was pure install cost.
#
# Every floor below is the lowest version with no OSV advisory against it, and
# each was queried rather than guessed. cryptography>=42 was the bad one: 42.0.0
# is installable and OSV has several HIGH advisories against it. No count is
# written here on purpose — how many there are is OSV's to change, weekly, and
# tools/check_floors.py asks rather than repeating a number from last time. It is
# raised to 50, which is where CVE-2026-69247 (a Bleichenbacher oracle in PKCS#7
# EnvelopedData decryption) is fixed — not a path this scanner walks, but a floor
# is a claim about what is supported, not about what today's lockfile resolves.
#
# httpx 0.27.0, beautifulsoup4 4.12.0 and packaging 24.0 each come back clean, so
# those floors are left where they are. Raising a floor that does not need it only
# costs users compatibility.
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "cryptography>=50",
    "packaging>=24",
]

# pytest 8.0.0 is affected by CVE-2025-71176, fixed in 9.0.3. Dev-only, so the
# blast radius is a contributor's machine rather than a user's — which is an
# argument for the floor being cheap to raise, not for leaving it.
#
# pytest-socket is what makes the README's "no test touches the network" claim
# checkable instead of merely true. 0.7.0 and up are clean per OSV; the floor is
# 0.7.0 because that is where --allow-hosts behaves as the CI step relies on.
[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-socket>=0.7"]

[project.scripts]
secscan = "scanner.cli:main"

[tool.setuptools.dynamic]
version = { attr = "scanner.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
