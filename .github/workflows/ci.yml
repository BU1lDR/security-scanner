# Runs the suite on every Python this project says it supports, and checks the
# installed command still behaves the way decisions.md D14 says it does.
#
# The matrix is not decoration. pyproject.toml declares requires-python = ">=3.11";
# development happens on 3.14, so 3.11, 3.12 and 3.13 were a promise nothing had
# ever tested. Either the floor is exercised or it should not be advertised.
#
# The network-blocking step below exists because the paragraph that used to sit
# here was wrong. It said pytest-socket could not prove the "no test touches the
# network" claim, because on Windows `asyncio.run()` builds a
# ProactorEventLoop that opens a socket for its own internal wakeup and
# --disable-socket therefore failed 115 tests that never go near a host.
#
# The observation was real; the conclusion did not follow. That wakeup socket is a
# loopback pair, so --allow-hosts=127.0.0.1,::1 permits it and blocks everything
# else. Measured on Windows, where the objection was supposed to be strongest: the
# full suite passes with sockets off, and a test that opens a real connection to
# api.osv.dev fails. Both halves checked, because a block that passes everything
# is indistinguishable from no block.
#
# Worth keeping the wrong version in view: it was an argument for why a check was
# impossible, it was written by whoever would have had to build the check, and
# nobody was going to audit it. That is the shape to distrust.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one old version failing should not hide the others
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # The suite again, with the network taken away. Loopback stays allowed:
      # asyncio's event loop builds its own self-wakeup socketpair, which is
      # AF_INET on Windows, and blocking that would fail tests for a reason that
      # has nothing to do with the claim being checked.
      #
      # This is a second full run rather than a permanent addopts entry, on
      # purpose. Under --disable-socket a test that starts reaching out fails with
      # a pytest-socket error instead of a connection error, which is a confusing
      # thing to hand someone debugging locally. The unrestricted run above is the
      # one whose failures are worth reading; this one answers one question.
      - name: No test touches the network
        run: python -m pytest -q --disable-socket --allow-hosts=127.0.0.1,::1

      # decisions.md quotes a test count. It was wrong three times, and each time
      # the change that broke it was adding tests. Checked rather than remembered.
      - name: The documented test count is the real one
        run: python tools/check_test_count.py

      # The suite covers main() in-process. This covers the console script the
      # user actually types, which is a different thing: an entry point can be
      # misdeclared in pyproject.toml and every unit test still passes.
      - name: The installed command runs
        run: secscan --help

      # D14: 2 is a bad target. This case used to exit 0 — a typo'd path scanned
      # nothing, found nothing, and reported success, which in a pipeline is a
      # green tick meaning the scan never ran. Pinned here so it stays fixed.
      - name: A missing path fails instead of passing quietly
        run: |
          set +e
          secscan ./definitely-not-a-real-path
          code=$?
          set -e
          echo "exit=$code"
          test "$code" = "2"

      # D14: 1 is "something at or above the threshold". Scanning our own source
      # finds real matches, so this also proves the SAST path works end to end
      # on the installed package rather than only on the source tree.
      - name: A scan with findings exits 1
        run: |
          set +e
          secscan ./src > report.txt
          code=$?
          set -e
          cat report.txt
          echo "exit=$code"
          test "$code" = "1"
